[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo"
version = "0.1.0"
description = "A personal, fully local CLI agent that can access Mac apps, open/close them, search the internet through the browser."
readme = "README.md"
authors = [
    { name = "Surjan", email = "tsurjan506@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sentry-sdk>=2.35.0",
    "typer>=0.26.8",
    "ytmusicapi>=1.12.1",
]

[project.scripts]
neo = "neo.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
