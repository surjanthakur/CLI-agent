[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo"
version = "0.1.0"
description = "A personal, fully local cli Neo that can access Mac apps and more."
readme = "README.md"
authors = [
    { name = "Surjan", email = "tsurjan506@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "sentry-sdk>=2.35.0",
    "setuptools>=83.0.0",
    "typer>=0.27.0",
    "ytmusicapi>=1.12.1",
]

[project.scripts]
neo = "neo.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
